<!DOCTYPE html>
<html>
<head><title>{{ taxon.name }}</title></head>
<body>
  <nav aria-label="breadcrumb">
    <a href="{% url 'taxon_list' %}">All taxa</a>
    {% for ancestor in taxon.get_ancestors %}
      &rsaquo; <a href="{% url 'taxon_detail' ancestor.pk %}">{{ ancestor.name }}</a>
    {% endfor %}
    &rsaquo; {{ taxon.name }}
  </nav>

  <h1>{{ taxon.name }}</h1>
  <p>Rank: {{ taxon.get_rank_display }}</p>

  <h2>Children</h2>
  <ul>
    {% for child in taxon.children.all %}
      <li><a href="{% url 'taxon_detail' child.pk %}">{{ child.name }}</a></li>
    {% empty %}
      <li>No children.</li>
    {% endfor %}
  </ul>
</body>
</html>
